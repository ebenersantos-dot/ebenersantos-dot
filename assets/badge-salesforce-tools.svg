<svg xmlns="http://www.w3.org/2000/svg" width="148" height="20" overflow="visible">
  <defs>
    <linearGradient id="sft-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1CBDE8"/>
      <stop offset="100%" stop-color="#0090BB"/>
    </linearGradient>
    <linearGradient id="sft-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sft-shadow" x="-4%" y="-15%" width="115%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="black" flood-opacity="0.35"/>
    </filter>
    <clipPath id="sft-clip">
      <rect width="148" height="20" rx="3"/>
    </clipPath>
  </defs>
  <rect width="148" height="20" rx="3" fill="url(#sft-bg)" filter="url(#sft-shadow)"/>
  <rect width="148" height="10" rx="3" fill="url(#sft-shine)"/>
  <rect y="4" width="148" height="6" fill="url(#sft-shine)"/>
  <rect y="17" width="148" height="3" rx="3" fill="black" opacity="0.15"/>
  <g clip-path="url(#sft-clip)">
    <rect x="-90" y="-3" width="50" height="26" fill="white" opacity="0.13" transform="skewX(-18)">
      <animate attributeName="x" from="-90" to="230" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    </rect>
  </g>
  <!-- Salesforce cloud (scaled for 20px badge) -->
  <g transform="translate(11,10)" fill="white" opacity="0.9">
    <circle cx="-3" cy="0.5" r="2.5"/>
    <circle cx="1" cy="-0.5" r="3.2"/>
    <circle cx="5" cy="0.5" r="2.2"/>
    <rect x="-5" y="1" width="12" height="3.5" rx="1"/>
  </g>
  <text x="22" y="14" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="10" font-weight="bold" fill="white" letter-spacing="0.5">SALESFORCE</text>
</svg>
