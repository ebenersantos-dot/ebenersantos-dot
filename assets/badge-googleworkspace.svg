<svg xmlns="http://www.w3.org/2000/svg" width="178" height="28" overflow="visible">
  <defs>
    <!-- 3D gradient: lighter top → darker bottom -->
    <linearGradient id="gw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5B9BF8"/>
      <stop offset="100%" stop-color="#2166D0"/>
    </linearGradient>
    <!-- Top bevel shine -->
    <linearGradient id="gw-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="gw-shadow" x="-4%" y="-15%" width="115%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="black" flood-opacity="0.38"/>
    </filter>
    <!-- Clip sweep to badge shape -->
    <clipPath id="gw-clip">
      <rect width="178" height="28" rx="4"/>
    </clipPath>
  </defs>

  <!-- Base with gradient + shadow -->
  <rect width="178" height="28" rx="4" fill="url(#gw-bg)" filter="url(#gw-shadow)"/>

  <!-- Top-half bevel shine (3D depth) -->
  <rect width="178" height="14" rx="4" fill="url(#gw-shine)"/>
  <rect y="6" width="178" height="8" fill="url(#gw-shine)"/>

  <!-- Bottom edge darkening (pressed-in base) -->
  <rect y="24" width="178" height="4" rx="4" fill="black" opacity="0.15"/>

  <!-- Shimmer sweep animation (offset 1.2s from MS badge for variety) -->
  <g clip-path="url(#gw-clip)">
    <rect x="-90" y="-4" width="60" height="36" fill="white" opacity="0.14" transform="skewX(-18)">
      <animate attributeName="x" from="-90" to="260" dur="4s" repeatCount="indefinite" begin="1.2s"/>
    </rect>
  </g>

  <!-- Google "G" icon (arc + inner bar, white) -->
  <!-- Outer arc: circle r=8 centered at (15,14), cut open on right side -->
  <path d="M 23 14 A 8 8 0 1 0 19 21.9"
        stroke="white" stroke-width="2.8" fill="none"
        stroke-linecap="round"/>
  <!-- Horizontal bar from 3 o'clock inward -->
  <line x1="23" y1="14" x2="17" y2="14"
        stroke="white" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Text -->
  <text x="30" y="19"
    font-family="DejaVu Sans,Verdana,Geneva,sans-serif"
    font-size="11" font-weight="bold" fill="white" letter-spacing="0.7">
    GOOGLE WORKSPACE
  </text>
</svg>
