<svg xmlns="http://www.w3.org/2000/svg" width="236" height="28" overflow="visible">
  <defs>
    <linearGradient id="sf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1CBDE8"/>
      <stop offset="100%" stop-color="#0090BB"/>
    </linearGradient>
    <linearGradient id="sf-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="sf-shadow" x="-4%" y="-15%" width="115%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="black" flood-opacity="0.38"/>
    </filter>
    <clipPath id="sf-clip">
      <rect width="236" height="28" rx="4"/>
    </clipPath>
  </defs>
  <rect width="236" height="28" rx="4" fill="url(#sf-bg)" filter="url(#sf-shadow)"/>
  <rect width="236" height="14" rx="4" fill="url(#sf-shine)"/>
  <rect y="6" width="236" height="8" fill="url(#sf-shine)"/>
  <rect y="24" width="236" height="4" rx="4" fill="black" opacity="0.15"/>
  <g clip-path="url(#sf-clip)">
    <rect x="-90" y="-4" width="60" height="36" fill="white" opacity="0.14" transform="skewX(-18)">
      <animate attributeName="x" from="-90" to="320" dur="4s" repeatCount="indefinite" begin="0.7s"/>
    </rect>
  </g>
  <!-- Salesforce cloud icon (white) -->
  <g transform="translate(16,14)" fill="white" opacity="0.9">
    <circle cx="-4" cy="1" r="3.5"/>
    <circle cx="1" cy="-1" r="4.5"/>
    <circle cx="6.5" cy="0.5" r="3"/>
    <rect x="-7" y="1.5" width="16" height="5" rx="1.5"/>
  </g>
  <text x="30" y="19" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11" font-weight="bold" fill="white" letter-spacing="0.7">SALESFORCE TRAILBLAZER</text>
</svg>
