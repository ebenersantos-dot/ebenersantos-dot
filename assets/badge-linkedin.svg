<svg xmlns="http://www.w3.org/2000/svg" width="130" height="28" overflow="visible">
  <defs>
    <linearGradient id="li-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2196E0"/>
      <stop offset="100%" stop-color="#0A5CA8"/>
    </linearGradient>
    <linearGradient id="li-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="li-shadow" x="-4%" y="-15%" width="115%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="black" flood-opacity="0.38"/>
    </filter>
    <clipPath id="li-clip">
      <rect width="130" height="28" rx="4"/>
    </clipPath>
  </defs>
  <rect width="130" height="28" rx="4" fill="url(#li-bg)" filter="url(#li-shadow)"/>
  <rect width="130" height="14" rx="4" fill="url(#li-shine)"/>
  <rect y="6" width="130" height="8" fill="url(#li-shine)"/>
  <rect y="24" width="130" height="4" rx="4" fill="black" opacity="0.15"/>
  <g clip-path="url(#li-clip)">
    <rect x="-90" y="-4" width="60" height="36" fill="white" opacity="0.14" transform="skewX(-18)">
      <animate attributeName="x" from="-90" to="210" dur="4s" repeatCount="indefinite" begin="1.4s"/>
    </rect>
  </g>
  <!-- LinkedIn "in" icon: rounded square + "in" text -->
  <rect x="9" y="7" width="14" height="14" rx="2.5" fill="white" opacity="0.2"/>
  <rect x="9" y="7" width="14" height="14" rx="2.5" fill="none" stroke="white" stroke-width="1" opacity="0.7"/>
  <text x="16" y="19" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="9" font-weight="bold" fill="white">in</text>
  <text x="30" y="19" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11" font-weight="bold" fill="white" letter-spacing="0.7">LINKEDIN</text>
</svg>
