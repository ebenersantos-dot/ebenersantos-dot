<svg xmlns="http://www.w3.org/2000/svg" width="180" height="28" overflow="visible">
  <defs>
    <linearGradient id="br-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3BACD6"/>
      <stop offset="100%" stop-color="#1580B0"/>
    </linearGradient>
    <linearGradient id="br-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="br-shadow" x="-4%" y="-15%" width="115%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="black" flood-opacity="0.38"/>
    </filter>
    <clipPath id="br-clip">
      <rect width="180" height="28" rx="4"/>
    </clipPath>
  </defs>
  <rect width="180" height="28" rx="4" fill="url(#br-bg)" filter="url(#br-shadow)"/>
  <rect width="180" height="14" rx="4" fill="url(#br-shine)"/>
  <rect y="6" width="180" height="8" fill="url(#br-shine)"/>
  <rect y="24" width="180" height="4" rx="4" fill="black" opacity="0.15"/>
  <g clip-path="url(#br-clip)">
    <rect x="-90" y="-4" width="60" height="36" fill="white" opacity="0.14" transform="skewX(-18)">
      <animate attributeName="x" from="-90" to="260" dur="4s" repeatCount="indefinite" begin="0s"/>
    </rect>
  </g>
  <!-- Rocket icon (white) centered at x=16, y=14 -->
  <g transform="translate(16,14)" fill="white">
    <polygon points="0,-7 3,0 -3,0"/>
    <rect x="-2" y="0" width="4" height="5"/>
    <polygon points="-2,2 -5,7 -2,5.5"/>
    <polygon points="2,2 5,7 2,5.5"/>
    <ellipse cx="0" cy="6" rx="2" ry="1.3" fill="#FFDD57" opacity="0.95"/>
  </g>
  <text x="30" y="19" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11" font-weight="bold" fill="white" letter-spacing="0.7">BLUE ROCKET CO.</text>
</svg>
